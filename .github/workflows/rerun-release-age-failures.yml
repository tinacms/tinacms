name: Re-run Release-Age Failures

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rerun-release-age-failures
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      runs: ${{ steps.find.outputs.runs }}
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Find Dependabot runs that only failed the release-age check
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/rerun-release-age-failures.mjs

  rerun:
    needs: find
    if: needs.find.outputs.runs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-run the failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNS: ${{ needs.find.outputs.runs }}
        run: |
          status=0
          for id in $(jq -r '.[]' <<< "$RUNS"); do
            gh run rerun "$id" --failed --repo "$GITHUB_REPOSITORY" || status=1
          done
          exit $status
