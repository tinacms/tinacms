name: Playwright — SvelteKit kitchen-sink

on:
  pull_request:
    branches:
      - main
    paths:
      - 'examples/sveltekit/kitchen-sink/**'
      - 'packages/@tinacms/sveltekit/**'
      - '.github/workflows/playwright-sveltekit-kitchen-sink.yml'

permissions:
  contents: read

jobs:
  e2e:
    name: sveltekit-kitchen-sink-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: package.json
          run_install: false
      - name: Install dependencies
        run: pnpm install
      - name: Build workspace packages
        run: pnpm build
      # svelte-check reads the packages' declarations, which only `types` emits.
      - name: Build workspace package types
        run: pnpm types
      - name: Install Playwright browsers
        working-directory: examples/sveltekit/kitchen-sink
        run: pnpm exec playwright install --with-deps chromium
      - name: Run SvelteKit kitchen-sink checks and unit tests
        working-directory: examples/sveltekit/kitchen-sink
        run: pnpm test
      - name: Run SvelteKit kitchen-sink Playwright tests
        working-directory: examples/sveltekit/kitchen-sink
        run: pnpm exec playwright test
        env:
          CI: true
