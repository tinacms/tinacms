name: Size Baseline

# Single-purpose workflow (like codeql.yml) so the weekly cron below only ever
# runs the size canary — a schedule trigger is workflow-level, and parking it
# here keeps every job in main.yml free of opt-out guards.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      update_size_baseline:
        description: >-
          Regenerate tests/size-baselines.json instead of checking against it,
          and upload the result as an artifact to commit. Baselines MUST come
          from here: the numbers are platform-specific (du block accounting,
          platform-optional binaries), so one generated on a dev machine can
          never match ubuntu-latest — a macOS baseline read 83 MB light.
        type: boolean
        default: false
  schedule:
    # Weekly real-registry canary. verdaccio (used on PRs) is seeded only from
    # HEAD, so it cannot reproduce published-registry history regressions; the
    # scheduled run installs the fixture from the real npm registry instead.
    # See scripts/size-baseline.mjs for the full rationale.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  # Gate the size-baseline job on whether the push / PR actually touched code
  # that can move install/tarball/bundle size. workflow_dispatch and schedule
  # fall through unconditionally so manual and weekly runs always execute.
  size-changes:
    name: Detect size-relevant changes
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.size == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          filters: |
            size:
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'scripts/size-baseline.mjs'
              - 'tests/size-fixture/**'
              - 'tests/size-baselines.json'
              - '.github/workflows/size-baseline.yml'
              # Metric 4 is the kitchen-sink's built admin bundle, so its Tina
              # config and collections move the number too.
              - 'examples/next/kitchen-sink/**'

  # Fails a PR that regresses install size, per-package tarball size, admin
  # bundle size, or introduces a duplicate copy of a watchlist package.
  # On the weekly schedule it runs the identical harness against the real npm
  # registry (--registry-mode=real) instead of the throwaway verdaccio one.
  size-baseline:
    name: Size baseline (${{ github.event_name == 'schedule' && 'real registry' || 'verdaccio' }})
    needs: size-changes
    if: needs.size-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2

      - name: Setup Node.js environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        name: Install pnpm
        id: pnpm-install
        with:
          package_json_file: package.json
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      # Metric 3 (per-package unpacked size) packs built dist output and metric 4
      # (admin bundle) runs `tinacms build`, so the workspace must be built first.
      - name: Build
        run: pnpm build

      - name: Size check
        if: inputs.update_size_baseline != true
        run: pnpm size:check ${{ github.event_name == 'schedule' && '--registry-mode=real' || '' }}

      # Re-baselining path. Runs the identical measurement, writes the JSON, and
      # hands it back as an artifact rather than pushing — CI keeps read-only
      # contents permission, and a human still reviews the numbers before they
      # become the thing every future PR is gated on.
      - name: Regenerate size baseline
        if: inputs.update_size_baseline == true
        run: pnpm size:update

      - name: Upload regenerated baseline
        if: inputs.update_size_baseline == true
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: size-baselines
          path: |
            tests/size-baselines.json
            tests/size-fixture/package-lock.fixture.json
          if-no-files-found: error
