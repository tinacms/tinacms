name: Classify issue

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to classify
        required: true
        type: number
      dry_run:
        description: Print the decision without commenting or labelling
        type: boolean
        default: true

# Set the repository variable CLASSIFY_DRY_RUN to "true" to run in shadow mode on real issues.

permissions:
  issues: write

concurrency:
  group: classify-issue-${{ github.event.issue.number || inputs.issue_number }}

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github/scripts
            .github/issue-labels.json
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Classify against the label taxonomy
        run: node .github/scripts/classify-issue.mts
        env:
          GH_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          DRY_RUN: ${{ inputs.dry_run == true || vars.CLASSIFY_DRY_RUN == 'true' }}
